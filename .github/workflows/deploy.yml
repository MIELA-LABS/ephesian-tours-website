# Build the site with build.py and deploy dist/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; Playwright's --with-deps
    # installer is verified on 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Dev requirements include Playwright and Pillow, used to print the pastor's packet PDF.
      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium for the PDF
        run: python -m playwright install --with-deps chromium

      - name: Leak guard (no private files or business terms in the public repo)
        run: python scripts/check_public.py

      - id: pages
        uses: actions/configure-pages@v6

      # base_url is the Pages URL (or the custom domain once one is attached),
      # used for canonical and Open Graph tags.
      # --packet also renders dist/ephesian-tours-pastor-packet.pdf from the same content;
      # the build fails if the PDF cannot be made (missing image, fonts not loaded, ...).
      - name: Build site and pastor's packet
        run: python build.py --packet --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Check the packet is in the artifact
        run: test -s dist/ephesian-tours-pastor-packet.pdf

      - name: Leak guard on the built site and PDF
        run: python scripts/check_public.py --dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
