# Build the site with build.py and deploy dist/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Leak guard (no private files or business terms in the public repo)
        run: python scripts/check_public.py

      - id: pages
        uses: actions/configure-pages@v6

      # base_url is the Pages URL (or the custom domain once one is attached),
      # used for canonical and Open Graph tags.
      - name: Build site
        run: python build.py --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
