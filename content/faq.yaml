  - id: insurance
    question: Do we need travel insurance?
    answer: |-
      We strongly recommend comprehensive travel and health insurance, including trip cancellation, medical, and emergency evacuation coverage. Most U.S. health plans, including Medicare, provide little or no coverage abroad.
    status: pending
