  - id: catholic
    title: Ephesus & the House of Mary
    subtitle: A Catholic pilgrimage to Ephesus, Patmos, and Istanbul
    tag: Catholic pilgrimage
    status: proposed
    resolves_by: Q-CATHOLIC-01
    duration_days: 8
    duration_nights: 7
    from_price:
      value: 2995
      currency: USD
      basis: per person, double occupancy, land + DFW airfare
      status: pending
      resolves_by: Q-PRICE-01
    image: house_of_mary
    summary: >-
      A pilgrimage for parishes, based in Kuşadası: Ephesus, the House of the Virgin Mary,
      the Basilica of St. John, Patmos, and Laodicea, with a final day in Istanbul.
    highlights:
      - value: Mass at the House of the Virgin Mary, celebrated by your own priest
        status: pending
        resolves_by: Q-MASS-01
      - Ephesus and the Basilica of St. John
      - A day on Patmos, where John received the Revelation
    route:
      - {site: smyrna, by: air}
      - kusadasi
      - house_of_mary
      - ephesus
      - st_john_basilica
      - sirince
      - {site: patmos, by: sea}
      - {site: kusadasi, by: sea}
      - laodicea
      - hierapolis
      - {site: istanbul, by: air}
    days:
      - n: 1
        title: Arrive in İzmir
        body: >-
          Fly from Dallas–Fort Worth to İzmir via Istanbul and transfer to our hotel in
          Kuşadası, our home for the first four nights.
        overnight: Kuşadası
        note:
          value: Airport welcome arrangements are being confirmed.
          status: pending
          resolves_by: Q-OPS-01
      - n: 2
        title: The House of the Virgin Mary and Ephesus
        body: >-
          Morning at the House of the Virgin Mary, venerated by Catholics as Mary's final
          home, visited by several popes, with Mass celebrated by your group's own priest.
          Afternoon walking the marble streets of Ephesus.
        overnight: Kuşadası
        refs: [John 19:26–27, Acts 19]
        note:
          value: Mass at the House of the Virgin Mary is being confirmed.
          status: pending
          resolves_by: Q-MASS-01
      - n: 3
        title: The Basilica of St. John and Şirince
        body: >-
          The Basilica of St. John in Selçuk, raised by Emperor Justinian over the apostle's
          traditional tomb; the site of the Temple of Artemis; and the Ephesus Museum.
          Afternoon in the hillside village of Şirince.
        overnight: Kuşadası
      - n: 4
        title: Patmos
        body: >-
          A day trip by boat to Patmos, where John received the Revelation: the Cave of the
          Apocalypse and the Monastery of St. John.
        overnight: Kuşadası
        refs: [Rev 1:9]
      - n: 5
        title: Laodicea and Pamukkale
        body: >-
          Drive inland to Laodicea, the church that was "neither cold nor hot," and on to the
          white travertine terraces of Pamukkale.
        overnight: Pamukkale
        refs: [Col 4:13, Rev 3:14–22]
      - n: 6
        title: Hierapolis, then fly to Istanbul
        body: >-
          Morning at Hierapolis and the shrine honoring the apostle Philip, martyred here
          according to tradition. Afternoon flight to Istanbul.
        overnight: Istanbul
        refs: [Col 4:13]
      - n: 7
        title: Istanbul
        body: >-
          Hagia Sophia, completed in AD 537 and a functioning mosque since 2020, where
          visitors are welcome outside prayer times; the Hippodrome; and the Blue Mosque.
          Farewell dinner.
        overnight: Istanbul
        note:
          value: Group visiting arrangements at Hagia Sophia are being confirmed.
          status: pending
          resolves_by: Q-HAGIA-01
      - n: 8
        title: Fly home
        body: Transfer to Istanbul Airport for our flight home to Dallas–Fort Worth.
