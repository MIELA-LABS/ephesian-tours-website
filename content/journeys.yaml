  - id: footsteps_of_paul
    group: bible
    title: In the Footsteps of St. Paul
    subtitle: Istanbul, the churches of Revelation, Hierapolis, and Ephesus
    tag: Shorter journey
    duration_days: 6
    duration_nights: 5
    prices:
      winter: 2895
      spring_fall: 3295
      summer: 3595
      status: tracked
      resolves_by: ET-AIR-01
    image: curetes
    video: ephesus_vimeo
    summary: >-
      A focused journey for groups with less time: Istanbul, Hierapolis, and five of the seven
      churches of Revelation, ending with a day walking the streets of Ephesus.
    highlights:
      - Walk the marble street of Ephesus, where Paul ministered for about three years
      - Time for Scripture and prayer together inside ancient Ephesus
      - "Five of the seven churches: Ephesus, Smyrna, Sardis, Philadelphia, and Laodicea"
    route:
      - istanbul
      - {site: smyrna, by: air}
      - sardis
      - philadelphia
      - hierapolis
      - laodicea
      - kusadasi
      - ephesus
      - smyrna
    days:
      - n: 1
        title: Arrive in Istanbul
        body: >-
          After the overnight flight from Dallas–Fort Worth, our guide meets us at Istanbul
          Airport and we transfer to our hotel.
        overnight: Istanbul
      - n: 2
        title: Istanbul, then fly to İzmir
        body: >-
          Hagia Sophia, completed in AD 537 and a functioning mosque since 2020, where
          visitors are welcome outside prayer times; the Hippodrome; Topkapı Palace; the Blue
          Mosque; and the Grand Bazaar. Evening flight to İzmir.
        overnight: İzmir
      - n: 3
        title: Smyrna, Sardis, and Philadelphia
        body: >-
          In Smyrna, remember Polycarp, the bishop martyred here. Then on to Sardis, the
          church told to “wake up,” and Philadelphia, the church set before “an open door,”
          before continuing to Pamukkale.
        overnight: Pamukkale
        refs: [Rev 2:8–11, Rev 3:1–6, Rev 3:7–13]
      - n: 4
        title: Hierapolis and Laodicea
        body: >-
          Hierapolis and the white terraces of Pamukkale, then Laodicea, the church that was
          “neither cold nor hot.” In the afternoon, drive to Kuşadası on the Aegean coast.
        overnight: Kuşadası
        refs: [Col 4:13, Rev 3:14–22]
      - n: 5
        title: Ephesus
        body: >-
          Walk the marble street Paul knew, from the Magnesian Gate down past the later
          Library of Celsus to the Great Theatre, where the riot of the silversmiths broke
          out. Paul spent about three years in this city.
        overnight: Kuşadası
        refs: [Acts 19–20, Eph 1:1]
        note: We can find a quiet place inside the site for a short service or Scripture reading.
      - n: 6
        title: Fly home
        body: >-
          Transfer to İzmir airport and fly home to Dallas–Fort Worth via Istanbul.
        note:
          value: Return flight times are in your quote.
          status: tracked
          resolves_by: ET-AIR-01
    add_ons: [house_of_mary, patmos]
    notes:
      - Ask about a complimentary place for your pastor or group leader.


