  # =========================================================================
  - id: best_of_turkey
    group: discover
    title: Best of Turkey
    subtitle: Istanbul, Cappadocia, Iconium, Ephesus, and Gallipoli
    tag: Bible and history
    duration_days: 12
    duration_nights: null  # Day 12 ends with an overnight in Istanbul; flight home the next morning
    from_price:
      value: 3995
      currency: USD
      basis: per person, double occupancy, land + DFW airfare
      status: pending
      resolves_by: Q-PRICE-01
    image: cappadocia
    summary: >-
      The grand tour: the biblical sites woven together with Cappadocia’s rock-cut
      churches, the Anatolian heartland, the Turquoise Coast, and the great cities of the
      Aegean.
    highlights:
      - Cappadocia’s rock-cut churches and underground cities
      - Konya, biblical Iconium, and Antalya, Paul’s port of Attalia
      - Ephesus, Laodicea, and Pergamum
    route:
      - istanbul
      - ankara
      - cappadocia
      - konya
      - antalya
      - hierapolis
      - laodicea
      - aphrodisias
      - kusadasi
      - ephesus
      - house_of_mary
      - pergamum
      - troy
      - canakkale
      - {site: gallipoli, by: sea}
      - istanbul
    days:
      - n: 1
        title: Welcome to Istanbul
        body: >-
          After the overnight flight from Dallas–Fort Worth, we are welcomed at Istanbul
          Airport and transferred to our hotel. Welcome dinner together.
        overnight: Istanbul
        note:
          value: Airport welcome arrangements are being confirmed.
          status: pending
          resolves_by: Q-OPS-01
      - n: 2
        title: Istanbul
        body: >-
          The Blue Mosque; Hagia Sophia, completed in AD 537 and a functioning mosque since
          2020, where visitors are welcome outside prayer times; and the Grand Bazaar.
          Optional: Topkapı Palace.
        overnight: Istanbul
        note:
          value: Group visiting arrangements at Hagia Sophia are being confirmed.
          status: pending
          resolves_by: Q-HAGIA-01
      - n: 3
        title: Ankara
        body: >-
          Travel to Ankara, Turkey’s capital and ancient Ancyra, capital of the Roman province
          of Galatia. Visit the Museum of Anatolian Civilizations and Anıtkabir, the
          mausoleum of Atatürk.
        overnight: Ankara
      - n: 4
        title: Into Cappadocia
        body: >-
          Past the great salt lake, Tuz Gölü, into Cappadocia. Explore an underground city,
          used over the centuries as a refuge, including by Byzantine-era Christians, and
          visit the potters of Avanos.
        overnight: Cappadocia
      - n: 5
        title: Cappadocia
        body: >-
          An optional sunrise balloon flight, then the Göreme Open-Air Museum, whose rock-cut
          churches are covered in Byzantine frescoes, and the valleys and fairy chimneys of
          Zelve. People from Cappadocia heard the apostles at Pentecost, and Peter’s first
          letter is addressed to believers here.
        overnight: Cappadocia
        refs: [Acts 2:9, 1 Pet 1:1]
      - n: 6
        title: Konya (Iconium) and on to Antalya
        body: >-
          Stop at the Sultanhanı caravanserai, then Konya, biblical Iconium, where Paul and
          Barnabas preached; visit the Mevlana Museum. Continue over the Taurus Mountains to
          Antalya.
        overnight: Antalya
        refs: [Acts 14:1–6]
      - n: 7
        title: Antalya
        body: >-
          A day at leisure in Antalya, biblical Attalia, where Paul and Barnabas came down to
          the coast at the end of their first journey. Optional: Perge and the Roman theater
          at Aspendos.
        overnight: Antalya
        refs: [Acts 13:13–14, Acts 14:25]
      - n: 8
        title: Pamukkale, Hierapolis, and Laodicea
        body: >-
          The white travertine terraces of Pamukkale, the ruins of Hierapolis above them, and
          Laodicea, the church that was “neither cold nor hot.”
        overnight: Pamukkale
        refs: [Col 4:13, Rev 3:14–22]
      - n: 9
        title: Aphrodisias and the Aegean
        body: >-
          The marble city of Aphrodisias, with its stadium and sculpture, then on to Kuşadası
          on the Aegean coast.
        overnight: Kuşadası
      - n: 10
        title: Ephesus and the House of the Virgin Mary
        body: >-
          Ephesus: the Library of Celsus, the Temple of Hadrian, and the Great Theatre. See
          the lone column that marks the Temple of Artemis, then visit the House of the
          Virgin Mary, venerated by Catholics as Mary’s final home, visited by several popes.
        overnight: Kuşadası
        refs: [Acts 19, Eph 1:1, John 19:26–27]
      - n: 11
        title: Pergamum and Troy
        body: >-
          The acropolis and Asclepion of Pergamum, then legendary Troy.
        overnight: Çanakkale
        refs: [Rev 2:12–17]
      - n: 12
        title: Gallipoli and Istanbul
        body: >-
          Cross the Dardanelles to the Gallipoli peninsula and its memorials, then return to
          Istanbul. Optional Bosphorus cruise. Farewell dinner.
        overnight: Istanbul
    included:
      value:
        - Round-trip group airfare from DFW
        - Hotels throughout, double occupancy
        - Daily breakfast and dinner
        - Licensed English-speaking guide and private air-conditioned coach
        - Entrance fees for all sites on the itinerary
        - Hakan as your escort from DFW and back
      status: pending
      resolves_by: Q-INCL-01
    excluded:
      value:
        - Optional excursions (balloon flight, Topkapı Palace, Perge and Aspendos, Bosphorus cruise)
        - Lunches and drinks
        - Tips for guides and drivers
        - Travel insurance
        - Personal expenses
      status: pending
      resolves_by: Q-INCL-01
