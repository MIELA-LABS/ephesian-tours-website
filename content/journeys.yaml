extensions:
  heading: Extend your journey
  intro: >-
    Add a few days before or after any journey, or build your own around the places that
    matter most to your church.
  status: pending
  resolves_by: Q-CUSTOM-01
  items:
    - title: Istanbul & Cappadocia
      length: 8 days
      body: >-
        More time in Istanbul, plus Cappadocia's frescoed rock churches and the underground
        cities of Derinkuyu and Kaymaklı.
    - title: West Anatolia
      length: 8 days
      body: >-
        Istanbul, Bursa, Pergamum, Ephesus, and the House of the Virgin Mary, with the Ionian
