      - value: The flight home to DFW departs the morning after Day 12; timing is being confirmed.
        status: pending
        resolves_by: Q-AIR-01
      - value: One complimentary place for the pastor or group leader, depending on group size.
        status: pending
        resolves_by: Q-FOC-01


