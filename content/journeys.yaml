  - id: catholic
    group: bible
    title: Ephesus & the House of Mary
    subtitle: A Catholic pilgrimage to Ephesus, the House of Mary, and Istanbul
    tag: Catholic pilgrimage
    duration_days: 7
    duration_nights: 6
    prices:
      winter: 3195
      spring_fall: 3595
      summer: 3795
      status: tracked
      resolves_by: ET-AIR-01
    image: house_of_mary
    summary: >-
      A pilgrimage for parishes, based in Kuşadası: Ephesus and the House of the Virgin Mary,
      the Basilica of St. John, Laodicea and Hierapolis, with a final day in Istanbul.
    highlights:
      - Mass at the House of the Virgin Mary, celebrated by your own priest
      - Ephesus and the Basilica of St. John
      - Laodicea and Hierapolis, two cities of Paul’s letter to the Colossians
    route:
      - {site: smyrna, by: air}
      - kusadasi
      - ephesus
      - house_of_mary
      - st_john_basilica
      - sirince
      - laodicea
      - hierapolis
      - {site: istanbul, by: air}
    days:
      - n: 1
        title: Arrive in İzmir
        body: >-
          Fly from Dallas–Fort Worth to İzmir via Istanbul. Our guide meets us at the airport
          and we transfer to our hotel in Kuşadası, our home for the first three nights.
        overnight: Kuşadası
      - n: 2
        title: Ephesus and the House of the Virgin Mary
        body: >-
          A full day. In the morning, walk the marble streets of Ephesus. Then the House of
          the Virgin Mary, venerated by Catholics as Mary’s final home, visited by several
          popes, with Mass celebrated by your group’s own priest.
        overnight: Kuşadası
        refs: [Acts 19, John 19:26–27]
      - n: 3
        title: The Basilica of St. John and Şirince
        body: >-
          The Basilica of St. John in Selçuk, raised by Emperor Justinian over the apostle’s
          traditional tomb; the site of the Temple of Artemis; and the Ephesus Museum.
          Afternoon in the hillside village of Şirince.
        overnight: Kuşadası
      - n: 4
        title: Laodicea and Pamukkale
        body: >-
          Drive inland to Laodicea, the church that was “neither cold nor hot,” and on to the
          white travertine terraces of Pamukkale.
        overnight: Pamukkale
        refs: [Col 4:13, Rev 3:14–22]
      - n: 5
        title: Hierapolis, then fly to Istanbul
        body: >-
          Morning at Hierapolis and the shrine honoring the apostle Philip, martyred here
          according to tradition. Afternoon flight to Istanbul.
        overnight: Istanbul
        refs: [Col 4:13]
      - n: 6
        title: Istanbul
        body: >-
          Hagia Sophia, completed in AD 537 and a functioning mosque since 2020, where
          visitors are welcome outside prayer times; the Hippodrome; and the Blue Mosque.
          Farewell dinner.
        overnight: Istanbul
      - n: 7
        title: Fly home
        body: Transfer to Istanbul Airport for our flight home to Dallas–Fort Worth.
    add_ons: [patmos]
    notes:
      - Mass at the House of Mary can be added to any of our journeys. There is no fee; groups customarily leave a donation.
      - Ask about a complimentary place for your priest or group leader.

