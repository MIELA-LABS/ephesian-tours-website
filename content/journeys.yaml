          After the overnight flight from Dallas–Fort Worth, we transfer to our hotel along
          the Golden Horn. Dinner together.
        overnight: Istanbul
      - n: 2
        title: Istanbul
        body: >-
          Hagia Sophia, completed in AD 537 and a functioning mosque since 2020, where visitors
          are welcome outside prayer times; Topkapı Palace; the Blue Mosque; and the Hippodrome.
        overnight: Istanbul
      - n: 3
        title: To Cappadocia
        body: >-
          Fly to Kayseri and visit Uçhisar, the Göreme valley, and Zelve, where Christians
          carved churches and homes into the soft volcanic rock. People from Cappadocia heard
          the apostles at Pentecost, and Peter’s first letter is addressed to believers here.
        overnight: Cappadocia
        refs: [Acts 2:9, 1 Pet 1:1]
      - n: 4
        title: Underground cities, then Konya
        body: >-
          Ürgüp and the underground cities of Derinkuyu and Kaymaklı, used for centuries as
          places of refuge, including by Byzantine-era Christians. Then drive to Konya,
          biblical Iconium, where Paul and Barnabas preached.
        overnight: Konya
        refs: [Acts 14:1–6]
      - n: 5
        title: Konya to Pamukkale
        body: Visit the Mevlana Museum, then drive west to Pamukkale.
        overnight: Pamukkale
      - n: 6
        title: Hierapolis and Aphrodisias
        body: >-
          Hierapolis, above Pamukkale’s white travertine terraces, whose believers Paul
          mentions in his letter to the Colossians; then the marble city of Aphrodisias, and on
          to Kuşadası.
        overnight: Kuşadası
        refs: [Col 4:13]
      - n: 7
        title: Ephesus
        body: >-
          Ephesus, the Ephesus Museum, and the Basilica of St. John, built over the apostle’s
          traditional tomb.
        overnight: Kuşadası
        refs: [Acts 19, Eph 1:1]
      - n: 8
        title: Fly home, or on to the Greek islands
        body: >-
          Transfer to İzmir airport for the flight home, or embark on a cruise to the Greek
          islands.
        note:
          value: Return flights to DFW, or the cruise option, are arranged in your quote.
          status: tracked
          resolves_by: ET-AIR-01
    excluded_extra:
      - Greek islands cruise option
    add_ons: [house_of_mary]
    notes:
      - Ask about a complimentary place for your pastor or group leader.

