# Pricing seasons, what's included, add-ons, and the payment timeline.
#
# The included / not-included lists are shared by every journey (a journey can add its own
# lines in journeys.yaml: included_extra / excluded_extra). Source: Azim Tours, 2026-10-06.
# The payment timeline, cancellation policy and payment methods are Ephesian Tours' own terms
# with travelers (2026-10-08), not the ground operator's.

booking:
  # fallback, shown only for a journey without prices
  pricing_title: Pricing on request
  pricing_note: >-
    We prepare a written quote for your dates and group size, including round-trip flights
    from DFW.

  seasons:
    - {id: winter, name: Winter, months: Nov–Mar}
    - {id: spring_fall, name: Spring & fall, months: "Apr–Jun, Sep–Oct"}
    - {id: summer, name: Summer, months: Jul–Aug}
  price_basis: Double occupancy, including round-trip airfare from DFW.
  airfare_note:
    value: Airfare is estimated until group fares are confirmed.
    status: tracked
    resolves_by: ET-AIR-01
  quote_note: >-
    Your written quote reflects your dates and group size. Prices are based on 20 travelers;
    smaller groups pay a little more per person.

  included:
    - value: Round-trip group airfare from DFW, including domestic flights within Türkiye
      status: tracked
      resolves_by: ET-AIR-01
    - 5-star hotels, mostly international chain hotels, centrally located; double or twin rooms
    - Breakfast and dinner every day (half board)
    - The same experienced English-speaking guide, a specialist in Christian groups, with you from arrival to departure
    - A private air-conditioned coach with Wi-Fi from your arrival airport to your departure airport, with experienced drivers
    - Entrance fees for every site on the itinerary
    - Porter service for your luggage at every hotel
    - Hakan as your escort from DFW and back

  excluded:
    - Lunches and drinks. Plan on about $20–40 per person per day, depending on the city.
    - "Tips: plan on about $15 per person per day ($10 for your guide, $5 for your driver)."
    - Travel and health insurance (strongly recommended)
    - Optional additions, such as a day on Patmos
    - Personal expenses and optional shopping

  add_ons:
    - id: patmos
      title: Add a day on Patmos
      body: >-
        We take your group by private boat from Kuşadası to the Greek island where John
        received the Revelation. Best suited to larger groups; priced in your quote. Patmos is
        in Greece, so bring your passport; EU entry requirements in force at the time of travel
        apply.
    - id: house_of_mary
      title: Add the House of Mary
      body: >-
        Add a visit to the House of the Virgin Mary near Ephesus (makes the Ephesus day a full
        day).

  milestones:
    - id: deposit
      label: Deposit
      when: At registration
      amount: $500 per person
      body: Reserves your place in the group.

    - id: final
      label: Final balance
      when: Due 90 days before departure
      body: Group airline tickets are issued after this.

    - id: departure
      label: Departure from DFW
      when: The day your journey begins
      body: Your Ephesian Tours host meets your group at the airport and flies with you.

  payment_methods: Check, bank transfer, or credit card.

  minimum_group: >-
    Groups of 10 or more travelers get the best price. Smaller groups can still travel, at a
    higher per-person price.

  cancellation_intro: Per traveler, from the date we receive written notice.
  cancellation:
    - when: 90 days or more before departure
      refund: Everything except $250 of the deposit
    - when: 89 to 60 days before departure
      refund: 50% of the journey price
    - when: 59 days or less before departure
      refund: No refund
  cancellation_note: >-
    We strongly recommend travel insurance, including ‘cancel for any reason’ coverage, to
    protect your payments.

  insurance_note: Strongly recommended.

  itinerary_footer: Day order may be adjusted to suit your dates.
