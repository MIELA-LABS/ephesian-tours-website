# Site-wide settings and section copy.
#
# Provenance: any value written as {value, status, resolves_by} is tracked.
#   status: confirmed | pending | proposed
#   resolves_by: an id from content/pending.yaml
# Pending/proposed values show a "Sample" badge while site.preview_mode is true.

site:
  brand_name: Ephesian Tours
  descriptor: Small-group journeys to the lands of the New Testament
  domain: ephesiantours.com
  base_url: https://ephesiantours.com/
  lang: en-US

  # true  -> "Sample" badges, preview banner, and <meta name="robots" content="noindex, nofollow">
  # false -> clean production page (the build warns if anything is still pending)
  preview_mode: true
  preview_banner: Preview — itineraries and pricing are samples pending confirmation.

  brand_line: An open door to the lands of the Bible.
  brand_line_ref: Rev 3:8
  scripture_notice: >-
    Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®),
    © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission.
    All rights reserved.
  partner_line: In partnership with Azim Tours — serving pilgrims in Turkey since 1975

  # Formspree endpoint for the contact form, e.g. https://formspree.io/f/abcdwxyz
  form_endpoint:
    value: https://formspree.io/f/REPLACE_ME
    status: pending
    resolves_by: ET-FORM-01

  seo_title: Ephesian Tours | Small-Group Bible Tours of Turkey from DFW
  seo_description: >-
    Small-group church journeys to the Seven Churches of Revelation, Ephesus,
    and the footsteps of Paul in Turkey. Personally escorted from Dallas–Fort Worth.
  og_image: assets/img/og-image.jpg
  og_image_alt: The Library of Celsus at Ephesus with the Ephesian Tours wordmark

hero:
  tagline: Walk where the early church was born.
  value_prop: Small church groups. Personally escorted from DFW. Expert local guides.
  image: celsus
  cta_primary: {label: Explore Our Tours, href: "#tours"}
  cta_secondary: {label: Plan a Trip for Your Church, href: "#contact"}

# Full-width verse band between the FAQ and "Your hosts" (ESV wording).
verse:
  text: Behold, I have set before you an open door, which no one is able to shut.
  ref: Rev 3:8
  image: aegean_sunset

nav:
  - {label: Tours, href: "#tours"}
  - {label: Sites, href: "#sites"}
  - {label: How It Works, href: "#how-it-works"}
  - {label: Your Hosts, href: "#hosts"}
  - {label: Our Partner, href: "#partner"}
  - {label: FAQ, href: "#faq"}
