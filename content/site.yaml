sections:
  why_turkey:
    eyebrow: Why Turkey
    heading: Where the New Testament comes alive
    intro: >-
      Much of the New Testament story unfolds in Asia Minor, the land we now call Turkey.
      Here the letters you read on Sunday were sent, received, and read aloud for the first time.
  tours:
    eyebrow: Featured tours
    heading: Journeys for your congregation
    intro: >-
      Each journey can be shaped around your church: its pace, its budget, and the passages
      your people care about most.
  sites:
    eyebrow: The sites
    heading: Places you’ve read about all your life
    intro: >-
      From the seven churches of Revelation to the cities of Paul’s journeys, these are the
      places your group will stand, Bible in hand.
  how_it_works:
    eyebrow: For pastors and trip leaders
    heading: How it works
    intro: >-
      You lead your people. We take care of everything else, from the first planning call
      to the flight home.
  partner:
    eyebrow: Your local partner
    heading: Azim Tours, on the ground in Turkey
  booking:
    eyebrow: Booking and payments
    heading: A simple, predictable timeline
    intro: >-
      Payments are spread out over the months before departure, so families can plan ahead.
  faq:
    eyebrow: Questions
    heading: What pastors and travelers ask us
  hosts:
    eyebrow: Your hosts
    heading: Traveling with you, every step
  contact:
    eyebrow: Contact
    heading: Plan a trip for your church
    intro: >-
      Tell us a little about your congregation and the journey you have in mind. We’ll reply personally.

why_turkey:
  - place: Tarsus
    title: Paul’s hometown
    body: >-
      The apostle Paul was born in Tarsus, on Turkey’s southern coast, and called it
      “no obscure city.”
    refs: [Acts 21:39, Acts 22:3]
  - place: Antioch
    title: Where believers were first called Christians
    body: >-
      The church at Antioch gave the name “Christian” to the world and became the home base
      for Paul’s missionary journeys.
    refs: [Acts 11:26]
  - place: Western Turkey
    title: All seven churches of Revelation
    body: >-
      Ephesus, Smyrna, Pergamum, Thyatira, Sardis, Philadelphia, and Laodicea all stood in
      what is now western Turkey. You can visit every one of them.
    refs: [Rev 2–3]
  - place: Ephesus
    title: Paul’s base, John’s home
    body: >-
      Paul ministered in Ephesus for about three years and later wrote to its believers.
      According to early church tradition, the apostle John spent his last years here.
    refs: [Acts 19–20, Eph 1:1]

how_it_works:
  steps:
    - icon: map
      title: We plan the itinerary with you
      body: >-
        Start from one of our journeys, or tell us what matters most to your congregation.
        Together we shape the route, the pace, and the budget.
    - icon: people
      title: Your congregation registers
      body: >-
        Members sign up individually. We answer their questions, collect their details, and
        send reminders, so you don’t have to.
    - icon: plane
      title: I fly with your group from DFW
      body: >-
        I meet your group at Dallas–Fort Worth, fly with you, and stay with you every day
        of the journey.
      signature: Hakan
      photo: hakan_avatar
    - icon: guide
      title: Azim Tours’ team meets you in Turkey
      body: >-
        Your guide meets the group at the airport and stays with you the whole way: the same
        experienced English-speaking guide, a specialist in Christian groups, with a private
        air-conditioned coach and 5-star hotels.
    - icon: home
      title: We come home together
      body: >-
        We fly home as one group, with photos, friendships, and a Bible that will never read
        quite the same again.
  leader_note:
    value: Ask about a complimentary place for your pastor or group leader.
    status: proposed
    resolves_by: ET-LEADER-01

partner:
  name: Azim Tours
  location: Kuşadası, Türkiye
  founded: 1975
  license_no:
    value: "938"
    status: confirmed
    resolves_by: Q-TURSAB-01
  license_body: TÜRSAB, the Association of Turkish Travel Agencies
  summary: >-
    Every journey’s arrangements in Turkey (hotels, coaches, guides, entrance tickets, and
    ferries) are operated by Azim Tours of Kuşadası, a short drive from Ephesus. Biblical
    and Christian study tours are a core part of their work, and they handle every detail
    from airport to airport.
  facts:
    - In business in Kuşadası since 1975
    - A veteran team, with an operations manager who has been with the company since 1985
    - Ferry and island services to Samos and Patmos since 1987
    - Their own vehicles, professional guides, and long-standing hotel relationships
    - The same experienced English-speaking guide for your whole journey, a specialist in Christian groups

hosts:
  intro:
    value: >-
      We are Hakan and Ece Yorgancı. We both grew up on Turkey’s Aegean coast, the same region
      as Ephesus and the seven churches, and have made our home in McKinney, Texas, for about
      twenty years, where we are raising our two daughters. Our families have known the
      founder of Azim Tours, our partner in Türkiye, for decades. Hakan personally escorts
      every group from DFW; Ece joins selected journeys.
    status: confirmed
    resolves_by: ET-HOST-01
  people:
    - id: hakan
      name: Hakan Yorgancı
      role: Founder & Host
      bio:
        value: >-
          Hakan was born and raised in İzmir, the biblical Smyrna and one of the seven
          churches of Revelation, and has called Texas home for about twenty years. For more
          than fifteen years his work has been making sure complex things don’t fail when it
          matters. He led a 20-engineer quality team at Samsung through the Galaxy, Note and
          Fold launches, then led AI reliability programs at Deloitte for clients including
          Meta, Pfizer, the U.S. Department of Veterans Affairs and Ascension Health. He brings
          the same care for detail to every journey, and he personally escorts each group from
          DFW to Türkiye and back. He holds a master’s degree in Digital Media Design from
          Harvard University and an MBA.
        status: confirmed
        resolves_by: ET-HOST-01
      credentials: Harvard University · MBA · Samsung · Deloitte
      photo:
        value: hakan
        status: confirmed
        resolves_by: ET-HOST-01
    - id: ece
      name: Ece Yorgancı
      role: Co-founder
      bio:
        value: >-
          Ece’s family comes from Kuşadası and Nazilli, a short drive from Ephesus. She has
          spent her career making complex things simple and welcoming for people: as a project
          consultant and content strategist for UNICEF, on Google’s ads quality team, and today
          on multilingual AI research at the University of Pennsylvania. At Ephesian Tours she
          shapes how every journey is planned and explained, so your congregation always knows
          what to expect. She holds an MBA.
        status: confirmed
        resolves_by: ET-HOST-01
      credentials: MBA · UNICEF · Google · University of Pennsylvania
      photo:
        value: ece
        status: confirmed
        resolves_by: ET-HOST-01

